[package]
name = "hsr-desktop"
version = "0.1.0"
description = "AstralOS Desktop Application"
edition = "2024"

[[bin]]
name = "hsr-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
ureq = { version = "3", features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
robinsr = { path = "../crates/robinsr" }
morax = { path = "../crates/morax" }
unpacker = { path = "../crates/unpacker" }
utils = { path = "../crates/utils" }
image = "0.25"
base64 = "0.22"
windows = { version = "0.62", features = [

    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }
hsr-ipc = { version = "0.1.0", path = "../crates/ipc" }
tauri-plugin-dialog = "2.7.2"
rfd = "0.17.2"

