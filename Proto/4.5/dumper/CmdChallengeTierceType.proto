syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message CLDOIEGCNLD {
    uint32 avatar_id = 1;
    uint32 avatar_type = 2;
    uint32 slot = 3;
    uint32 level = 4;
    uint32 skin_id = 5;
    ChallengeBossEquipmentInfo equipment = 6;
    ChallengeBossAvatarRelicInfo OKCGHKDMFAM = 7;
}

message ChallengeTierceChallengeInfo {
    uint32 stage_index = 15;
    uint32 challenge_id = 2;
    repeated LineupInfo lineup_list = 1;
    bool is_single_stage = 7;
    ChallengeTiercePendingStageSettle IIHFEDLHOPI = 6;
}

message ChallengeTierceData {
    ChallengeTierceRecord record = 15;
    repeated ChallengeTierceStageData result_list = 8;
    bool is_passed = 9;
    repeated uint32 finished_target_list = 5;
    repeated ChallengeTierceStageInfo stage_info_list = 7;
    uint32 challenge_id = 13;
}

message ChallengeTiercePendingStageSettle {
    uint32 NEDGGMGMLGO = 4;
    uint32 BIEPFFBBJHG = 1191;
    uint32 DPDNPCBNENI = 554;
    uint32 OPNPMBJDKNB = 2;
    uint32 EKKLCBKNAED = 1060;
    uint32 MMCPICGKOGD = 9;
}

message ChallengeTierceRecord {
    uint32 used_cycle_count = 5;
    uint32 total_score = 12;
}

message ChallengeTierceRecordInfo {
    uint32 challenge_id = 10;
    bool is_passed = 12;
    repeated uint32 finished_target_list = 5;
    repeated ChallengeTierceStageRecord result_list = 11;
}

message ChallengeTierceStageData {
    uint32 IBECKONIICF = 11;
    GLLFJFJBIBC lineup = 3;
    repeated BattleTarget battle_target_list = 1;
    uint32 stage_index = 13;
    uint32 score_id = 12;
    uint32 INLLMKEDGLC = 9;
    BattleEndStatus end_status = 14;
}

message ChallengeTierceStageInfo {
    repeated AvatarIdentifier lineup = 6;
    uint32 stage_index = 14;
    repeated uint32 peak_avatar_id_list = 13;
    uint32 buff_id = 8;
}

message ChallengeTierceStageLineupInfo {
    repeated AvatarIdentifier lineup = 10;
    uint32 buff_id = 14;
}

message ChallengeTierceStageRecord {
    uint32 score_id = 5;
    uint32 INLLMKEDGLC = 13;
    uint32 stage_index = 10;
    uint32 IBECKONIICF = 4;
}

enum CmdChallengeTierceType {
    CmdChallengeTierceType_None = 0;
    CmdChallengeTierceType_GetChallengeTierceControllerScRsp = 8992;
    CmdChallengeTierceType_ChallengeTierceScNotify = 8977;
    CmdChallengeTierceType_SetChallengeTierceLineupCsReq = 8996;
    CmdChallengeTierceType_ReStartChallengeTierceScRsp = 8979;
    CmdChallengeTierceType_LeaveChallengeTierceCsReq = 8980;
    CmdChallengeTierceType_ConfirmChallengeTierceStageSettleCsReq = 8988;
    CmdChallengeTierceType_ConfirmChallengeTierceStageSettleScRsp = 8999;
    CmdChallengeTierceType_GetChallengeTierceControllerCsReq = 8997;
    CmdChallengeTierceType_GetChallengeTierceDataScRsp = 8991;
    CmdChallengeTierceType_GetChallengeTierceDataCsReq = 8994;
    CmdChallengeTierceType_LeaveChallengeTierceScRsp = 8985;
    CmdChallengeTierceType_StartChallengeTierceScRsp = 8989;
    CmdChallengeTierceType_StartChallengeTierceCsReq = 8984;
    CmdChallengeTierceType_SetChallengeTierceLineupScRsp = 9000;
    CmdChallengeTierceType_ReStartChallengeTierceCsReq = 8974;
    CmdChallengeTierceType_StartNextChallengeTierceScRsp = 8982;
    CmdChallengeTierceType_StartNextChallengeTierceCsReq = 8981;
}

message ConfirmChallengeTierceStageSettleCsReq {
    bool IOBCIMIPEOM = 12;
}

message ConfirmChallengeTierceStageSettleScRsp {
    uint32 retcode = 2;
}

message GLLFJFJBIBC {
    repeated CLDOIEGCNLD MNABNJOEHLF = 1;
}

message GetChallengeTierceControllerCsReq {
}

message GetChallengeTierceControllerScRsp {
    uint32 retcode = 13;
    ChallengeTierceRecordInfo OHPGEHKFABM = 8;
    ChallengeTierceChallengeInfo challenge_tierce_info = 11;
}

message GetChallengeTierceDataCsReq {
}

message GetChallengeTierceDataScRsp {
    uint32 retcode = 11;
    repeated ChallengeTierceData challenge_info_list = 13;
}

message LeaveChallengeTierceCsReq {
}

message LeaveChallengeTierceScRsp {
    uint32 retcode = 13;
}

message MHJNOBBOFOC {
}

message PKKFNODINEM {
}

message SetChallengeTierceLineupCsReq {
    repeated ChallengeTierceStageLineupInfo stage_info_list = 3;
    uint32 challenge_id = 5;
}

message SetChallengeTierceLineupScRsp {
    uint32 retcode = 12;
}

message StartChallengeTierceCsReq {
    bool is_single_stage = 15;
    repeated ChallengeTierceStageLineupInfo stage_info_list = 2;
    uint32 challenge_id = 10;
    uint32 stage_index = 5;
}

message StartChallengeTierceScRsp {
    SceneInfo scene = 14;
    uint32 retcode = 12;
    ChallengeTierceChallengeInfo challenge_tierce_info = 5;
}
