syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdElationActivityType {
    CmdElationActivityType_None = 0;
    CmdElationActivityType_EnterElationActivityStageScRsp = 9109;
    CmdElationActivityType_ElationActivityBattleEndScNotify = 9106;
    CmdElationActivityType_EnterElationActivityStageCsReq = 9107;
    CmdElationActivityType_GetElationActivityDataScRsp = 9110;
    CmdElationActivityType_GetElationActivityDataCsReq = 9105;
}

message ElationActivityAvatar {
    AvatarType avatar_type = 8;
    uint32 avatar_id = 9;
}

message ElationActivityBattleEndScNotify {
    uint32 JCFMCEPKEHA = 4;
    ElationActivityLevelData level_data = 5;
    uint32 JIGFPIOBAHB = 2;
    uint32 perfect_wave = 10;
    uint32 level_id = 12;
}

message ElationActivityLevelData {
    bool is_perfect = 12;
    uint32 level_id = 4;
    uint32 FFGFINDLMCF = 7;
    uint32 CHPCJIBGKFK = 11;
    uint32 BOEINFJIILE = 13;
}

message EnterElationActivityStageCsReq {
    repeated ElationActivityAvatar fixed_avatar_list = 8;
    repeated ElationActivityAvatar player_selected_avatar_list = 9;
    uint32 level_id = 7;
}

message EnterElationActivityStageScRsp {
    uint32 level_id = 6;
    uint32 retcode = 7;
    SceneBattleInfo battle_info = 9;
}

message GetElationActivityDataCsReq {
}

message GetElationActivityDataScRsp {
    repeated ElationActivityLevelData level_data_list = 10;
    uint32 retcode = 2;
}
