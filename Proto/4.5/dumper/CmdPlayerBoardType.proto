syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdPlayerBoardType {
    CmdPlayerBoardType_None = 0;
    CmdPlayerBoardType_SetSignatureScRsp = 2872;
    CmdPlayerBoardType_SetHeadIconScRsp = 2839;
    CmdPlayerBoardType_SetDisplayAvatarCsReq = 2856;
    CmdPlayerBoardType_GetPlayerBoardDataCsReq = 2834;
    CmdPlayerBoardType_SetAssistAvatarCsReq = 2865;
    CmdPlayerBoardType_SetHeadIconCsReq = 2879;
    CmdPlayerBoardType_UnlockHeadIconScNotify = 2873;
    CmdPlayerBoardType_SetPersonalCardCsReq = 2871;
    CmdPlayerBoardType_SetDisplayAvatarScRsp = 2891;
    CmdPlayerBoardType_SetPersonalCardScRsp = 2804;
    CmdPlayerBoardType_GetPlayerBoardDataScRsp = 2882;
    CmdPlayerBoardType_SetAssistAvatarScRsp = 2880;
    CmdPlayerBoardType_SetIsDisplayAvatarInfoScRsp = 2826;
    CmdPlayerBoardType_SetIsDisplayAvatarInfoCsReq = 2898;
    CmdPlayerBoardType_SetSignatureCsReq = 2899;
}

message DisplayAvatarVec {
    bool is_display = 4;
    repeated SetDisplayAvatarCsReq display_avatar_list = 6;
}

message GetPlayerBoardDataCsReq {
}

message GetPlayerBoardDataScRsp {
    HeadFrameInfo head_frame_info = 7;
    uint32 current_personal_card_id = 5;
    repeated uint32 unlocked_personal_card_list = 1;
    uint32 current_head_icon_id = 9;
    DisplayAvatarVec display_avatar_vec = 8;
    repeated HeadIconData unlocked_head_icon_list = 15;
    uint32 retcode = 6;
    repeated uint32 assist_avatar_id_list = 10;
    string signature = 13;
}

message SetAssistAvatarCsReq {
    uint32 avatar_id = 14;
    repeated uint32 avatar_id_list = 10;
}

message SetAssistAvatarScRsp {
    uint32 retcode = 15;
    repeated uint32 avatar_id_list = 1;
    uint32 avatar_id = 11;
}

message SetDisplayAvatarCsReq {
    uint32 KOEOEHIMOEI = 8;
    uint32 GKKKEHJAKII = 15;
}

message SetDisplayAvatarScRsp {
    uint32 retcode = 2;
    repeated SetDisplayAvatarCsReq display_avatar_list = 1;
}

message SetHeadIconCsReq {
    uint32 id = 8;
}

message SetHeadIconScRsp {
    uint32 current_head_icon_id = 6;
    uint32 retcode = 2;
}

message SetIsDisplayAvatarInfoCsReq {
    bool is_display = 7;
}

message SetIsDisplayAvatarInfoScRsp {
    bool is_display = 7;
    uint32 retcode = 2;
}

message SetPersonalCardCsReq {
    uint32 id = 2;
}

message SetPersonalCardScRsp {
    uint32 retcode = 3;
    uint32 current_personal_card_id = 8;
}

message SetSignatureCsReq {
    string signature = 15;
}

message SetSignatureScRsp {
    uint32 retcode = 1;
    string signature = 4;
}
