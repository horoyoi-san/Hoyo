syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message ChallengeRaidNotify {
    KBONOPFLPDJ GCBDMEPBNHN = 3;
}

enum CmdRaidType {
    CmdRaidType_None = 0;
    CmdRaidType_SetClientRaidTargetCountCsReq = 2219;
    CmdRaidType_GetChallengeRaidInfoScRsp = 2232;
    CmdRaidType_StartRaidCsReq = 2236;
    CmdRaidType_LeaveRaidScRsp = 2224;
    CmdRaidType_GetSaveRaidCsReq = 2201;
    CmdRaidType_TakeChallengeRaidRewardCsReq = 2237;
    CmdRaidType_GetAllSaveRaidScRsp = 2242;
    CmdRaidType_LeaveRaidCsReq = 2244;
    CmdRaidType_SetClientRaidTargetCountScRsp = 2212;
    CmdRaidType_RaidKickByServerScNotify = 2225;
    CmdRaidType_GetSaveRaidScRsp = 2207;
    CmdRaidType_ChallengeRaidNotify = 2238;
    CmdRaidType_RaidInfoNotify = 2208;
    CmdRaidType_DelSaveRaidScNotify = 2218;
    CmdRaidType_GetChallengeRaidInfoCsReq = 2222;
    CmdRaidType_StartRaidScRsp = 2229;
    CmdRaidType_GetRaidInfoCsReq = 2221;
    CmdRaidType_GetAllSaveRaidCsReq = 2214;
    CmdRaidType_TakeChallengeRaidRewardScRsp = 2220;
    CmdRaidType_GetRaidInfoScRsp = 2217;
}

message DelSaveRaidScNotify {
    uint32 raid_id = 1;
    uint32 world_level = 2;
}

message FinishedRaidInfo {
    uint32 world_level = 5;
    repeated uint32 NGKBFPFOOPK = 1;
    uint32 raid_id = 13;
}

message GetAllSaveRaidCsReq {
}

message GetAllSaveRaidScRsp {
    repeated RaidData raid_data_list = 15;
    uint32 retcode = 7;
}

message GetRaidInfoCsReq {
}

message GetRaidInfoScRsp {
    repeated KBONOPFLPDJ challenge_raid_list = 2;
    repeated FinishedRaidInfo finished_raid_info_list = 12;
    uint32 retcode = 3;
    repeated uint32 challenge_taken_reward_id_list = 11;
}

message GetSaveRaidCsReq {
    uint32 world_level = 4;
    uint32 raid_id = 8;
}

message GetSaveRaidScRsp {
    uint32 raid_id = 9;
    bool is_save = 13;
    uint32 retcode = 5;
    repeated RaidTargetInfo raid_target_info = 4;
    uint32 world_level = 1;
}

message KBONOPFLPDJ {
    uint32 max_score = 10;
    uint32 raid_id = 11;
}

message LeaveRaidCsReq {
    bool is_save = 7;
    uint32 raid_id = 13;
}

message LeaveRaidScRsp {
    uint32 retcode = 3;
    uint32 world_level = 13;
    uint32 raid_id = 1;
}

enum MJPGDJIGLKO {
    MJPGDJIGLKO_NLCDGIPGFDJ = 0;
    MJPGDJIGLKO_BMOOGBNPEAA = 1;
    MJPGDJIGLKO_CIHFGJDCHIA = 2;
}

message RaidData {
    uint32 raid_id = 5;
    repeated RaidTargetInfo raid_target_info = 10;
    uint32 world_level = 7;
}

message RaidInfoNotify {
    RaidStatus status = 13;
    uint32 raid_id = 1;
    ItemList item_list = 9;
    uint64 raid_finish_time = 11;
    uint32 world_level = 8;
    repeated RaidTargetInfo raid_target_info = 14;
}

enum RaidStatus {
    RAID_STATUS_NONE = 0;
    RAID_STATUS_DOING = 1;
    RAID_STATUS_FINISH = 2;
    RAID_STATUS_FAILED = 3;
}

message RaidTargetInfo {
    MJPGDJIGLKO KCEEHIOCBPC = 14;
    uint32 KKCKMCDGCGK = 8;
    uint32 LCILPGIDEAC = 6;
}

message SetClientRaidTargetCountCsReq {
    uint32 KJKGHIEKNID = 12;
    uint32 progress = 8;
}

message SetClientRaidTargetCountScRsp {
    uint32 retcode = 3;
    uint32 KJKGHIEKNID = 12;
    uint32 progress = 6;
}

message StartRaidCsReq {
    uint32 is_save = 10;
    repeated AvatarIdentifier NIMDEPFJJNI = 6;
    uint32 raid_id = 14;
    uint32 prop_entity_id = 8;
    repeated uint32 avatar_list = 2;
    uint32 world_level = 7;
}

message StartRaidScRsp {
    uint32 retcode = 12;
    GEGLJDELBHA scene = 5;
}

message TakeChallengeRaidRewardCsReq {
    uint32 HEJANCCDGAP = 1;
}

message TakeChallengeRaidRewardScRsp {
    ItemList reward = 3;
    uint32 HEJANCCDGAP = 11;
    uint32 retcode = 2;
}
