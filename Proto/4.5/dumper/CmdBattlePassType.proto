syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message BattlePassInfoNotify {
    uint64 CBLNJDCICBC = 5;
    uint64 NJDCMGOJOLE = 14;
    uint64 PDODOAOHMAC = 11;
    uint64 AIMGGFNLIEK = 10;
    uint32 AECHNDNNMLF = 3;
    uint32 POJDILFNJAH = 12;
    uint32 exp = 9;
    uint64 DAFMMPKFOEA = 4;
    uint64 ICPCCGPEJMP = 7;
    uint64 CHJKOFANIKA = 15;
    uint64 OKPOHIHPOKI = 2;
    BpTierType DELEGHOCLMO = 8;
    uint32 level = 6;
}

enum BpRewardType {
    BpRewardType_BpRewaradTypeNone = 0;
    BpRewardType_BpRewaradTypeFree = 1;
    BpRewardType_BpRewaradTypePremium1 = 2;
    BpRewardType_BpRewaradTypePremium2 = 3;
    BpRewardType_BpRewaradTypePremiumOptional = 4;
}

enum BpTierType {
    BpTierType_None = 0;
    BpTierType_Free = 1;
    BpTierType_Premium1 = 2;
    BpTierType_Premium2 = 3;
}

message BuyBpLevelCsReq {
    uint32 IGOOJKMPMDC = 10;
}

message BuyBpLevelScRsp {
    uint32 retcode = 1;
}

enum CmdBattlePassType {
    CmdBattlePassType_None = 0;
    CmdBattlePassType_TakeBpRewardCsReq = 3039;
    CmdBattlePassType_TakeBpRewardScRsp = 3056;
    CmdBattlePassType_TakeAllRewardScRsp = 3073;
    CmdBattlePassType_BuyBpLevelCsReq = 3091;
    CmdBattlePassType_BattlePassInfoNotify = 3034;
    CmdBattlePassType_BuyBpLevelScRsp = 3098;
    CmdBattlePassType_TakeAllRewardCsReq = 3026;
}

message OptionalReward {
    uint32 optional_reward_id = 13;
    uint32 level = 14;
}

message TakeAllRewardCsReq {
    repeated OptionalReward EIKKALADEHM = 15;
}

message TakeAllRewardScRsp {
    ItemList reward = 13;
    uint32 retcode = 5;
}

message TakeBpRewardCsReq {
    BpRewardType type = 15;
    uint32 optional_reward_id = 14;
    uint32 level = 10;
}

message TakeBpRewardScRsp {
    uint32 retcode = 6;
    ItemList reward = 2;
}
