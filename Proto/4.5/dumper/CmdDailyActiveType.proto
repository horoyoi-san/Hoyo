syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdDailyActiveType {
    CmdDailyActiveType_None = 0;
    CmdDailyActiveType_TakeApRewardScRsp = 3382;
    CmdDailyActiveType_TakeAllApRewardScRsp = 3398;
    CmdDailyActiveType_TakeApRewardCsReq = 3334;
    CmdDailyActiveType_GetDailyActiveInfoScRsp = 3339;
    CmdDailyActiveType_TakeAllApRewardCsReq = 3391;
    CmdDailyActiveType_GetDailyActiveInfoCsReq = 3379;
    CmdDailyActiveType_DailyActiveInfoNotify = 3356;
}

message DailyActiveInfoNotify {
    repeated uint32 daily_active_quest_id_list = 3;
    uint32 daily_active_point = 7;
    repeated DailyActivityInfo daily_active_level_list = 12;
}

message DailyActivityInfo {
    bool is_has_taken = 10;
    uint32 level = 8;
    uint32 world_level = 7;
    uint32 daily_active_point = 15;
}

message GetDailyActiveInfoCsReq {
}

message GetDailyActiveInfoScRsp {
    uint32 daily_active_point = 14;
    repeated uint32 daily_active_quest_id_list = 7;
    uint32 retcode = 4;
    repeated DailyActivityInfo daily_active_level_list = 13;
}

message TakeAllApRewardCsReq {
}

message TakeAllApRewardScRsp {
    repeated uint32 take_reward_level_list = 14;
    uint32 retcode = 4;
    ItemList reward = 15;
}

message TakeApRewardCsReq {
    uint32 level = 6;
}

message TakeApRewardScRsp {
    ItemList reward = 7;
    uint32 level = 8;
    uint32 retcode = 9;
}
