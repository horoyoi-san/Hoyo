syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdRelicPresetType {
    CmdRelicPresetType_None = 0;
    CmdRelicPresetType_RelicPresetGetPlanCsReq = 9845;
    CmdRelicPresetType_RelicPresetUpdatePlanCsReq = 9851;
    CmdRelicPresetType_RelicPresetAddPlanScNotify = 9850;
    CmdRelicPresetType_RelicPresetAddPlanCsReq = 9860;
    CmdRelicPresetType_RelicPresetDeletePlanCsReq = 9849;
    CmdRelicPresetType_RelicPresetDeletePlanScRsp = 9852;
    CmdRelicPresetType_RelicPresetUpdatePlanScRsp = 9854;
    CmdRelicPresetType_RelicPresetClearNameScNotify = 9847;
    CmdRelicPresetType_RelicPresetGetPlanScRsp = 9855;
    CmdRelicPresetType_RelicPresetAddPlanScRsp = 9853;
}

enum FDJKLJGDCID {
    FDJKLJGDCID_NLCDGIPGFDJ = 0;
    FDJKLJGDCID_DCGAPNGCCEH = 1;
    FDJKLJGDCID_BMHMMIMOAIJ = 2;
    FDJKLJGDCID_JPDBDLEEHGK = 3;
    FDJKLJGDCID_OGPNODHENKN = 4;
    FDJKLJGDCID_PICLIGEAJFN = 5;
    FDJKLJGDCID_FHCEFAOHJJJ = 6;
}

message HPPOINFLEPJ {
    FDJKLJGDCID LLJJCOOKANH = 15;
    repeated uint32 relic_ids = 6;
    RelicPresetPlanSourceType source_type = 10;
}

message PFCKBFLDHNI {
    uint32 unique_id = 8;
    uint32 avatar_id = 1;
    repeated uint32 relic_ids = 5;
    string name = 2;
    RelicPresetPlanSourceType source_type = 7;
}

message RelicPresetAddPlanCsReq {
    RelicPresetPlanSourceType source_type = 11;
    FDJKLJGDCID LLJJCOOKANH = 5;
    repeated uint32 relic_ids = 9;
    uint32 avatar_id = 4;
    string name = 7;
}

message RelicPresetAddPlanScRsp {
    uint32 retcode = 15;
    PFCKBFLDHNI relic_plan = 11;
}

message RelicPresetDeletePlanCsReq {
    uint32 unique_id = 9;
}

message RelicPresetDeletePlanScRsp {
    uint32 unique_id = 3;
    uint32 retcode = 6;
}

message RelicPresetGetPlanCsReq {
    uint32 avatar_id = 12;
}

message RelicPresetGetPlanScRsp {
    uint32 avatar_id = 13;
    uint32 retcode = 10;
    repeated PFCKBFLDHNI relic_plan_list = 4;
}

enum RelicPresetPlanSourceType {
    RelicPresetPlanSourceType_None = 0;
    RelicPresetPlanSourceType_Mine = 1;
    RelicPresetPlanSourceType_SmartCustom = 2;
    RelicPresetPlanSourceType_SmartBigData = 3;
    RelicPresetPlanSourceType_SmartSystem = 4;
    RelicPresetPlanSourceType_FromScratch = 5;
    RelicPresetPlanSourceType_Platform = 6;
}

message RelicPresetUpdatePlanCsReq {
    uint32 unique_id = 1;
    HPPOINFLEPJ relic_list = 5;
    string name = 12;
}

message RelicPresetUpdatePlanScRsp {
    uint32 retcode = 10;
    uint32 unique_id = 14;
    HPPOINFLEPJ relic_list = 8;
    string name = 4;
}
