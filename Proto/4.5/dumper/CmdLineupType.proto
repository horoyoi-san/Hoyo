enum SyncLineupReason {
    SyncLineupReason_SyncReasonNone = 0;
    SyncLineupReason_SyncReasonMpAdd = 1;
    SyncLineupReason_SyncReasonMpAddPropHit = 2;
    SyncLineupReason_SyncReasonHpAdd = 3;
    SyncLineupReason_SyncReasonHpAddPropHit = 4;
    SyncLineupReason_SyncReasonMpMaxChangedPermanent = 5;
    SyncLineupReason_SyncReasonMpMaxChangedByModifier = 6;
