    bool OPHLICGEPIC = 11;
    uint32 base_avatar_id = 13;
    ExtraLineupType extra_lineup_type = 9;
    uint32 index = 5;
}

message QuitLineupScRsp {
    uint32 retcode = 11;
    bool MFBIPMACFCE = 13;
    bool OPHLICGEPIC = 10;
}

message ReplaceLineupCsReq {
    bool PLIEODDEEHG = 1;
    uint32 leader_slot = 2;
    bool HIAMAJKDIOO = 9;
    uint32 game_story_line_id = 10;
    uint32 plane_id = 11;
    repeated LineupSlotData lineup_slot_list = 13;
    uint32 index = 14;
    ExtraLineupType extra_lineup_type = 15;
}

message SetLineupNameCsReq {
    string name = 7;
    uint32 index = 14;
}

message SetLineupNameScRsp {
    string name = 13;
    uint32 retcode = 8;
    uint32 index = 12;
