syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdReplayType {
    CmdReplayType_None = 0;
    CmdReplayType_GetReplayTokenScRsp = 3582;
    CmdReplayType_GetReplayTokenCsReq = 3534;
}

message GetReplayTokenCsReq {
    uint32 stage_id = 9;
    string GIMGDNJPPDJ = 14;
    uint32 KLIFGJOILEE = 3;
    uint32 PBNIENNCNOP = 12;
    string LMFFNNIGMMO = 8;
    PBIEFHKNAFA replay_type = 11;
}

message GetReplayTokenScRsp {
    string GIMGDNJPPDJ = 6;
    uint32 stage_id = 9;
    PBIEFHKNAFA replay_type = 10;
    uint32 retcode = 11;
    string token = 14;
}
