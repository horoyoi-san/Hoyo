syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message BCAJNMLLIED {
    uint32 panel_id = 1;
    uint32 id = 6;
    uint32 progress = 8;
    repeated uint32 OLHODIFNABL = 7;
}

enum CmdRechargeGiftType {
    CmdRechargeGiftType_None = 0;
    CmdRechargeGiftType_GetRechargeBenefitInfoScRsp = 8372;
    CmdRechargeGiftType_TakeRechargeGiftRewardScRsp = 8373;
    CmdRechargeGiftType_TakeRechargeBenefitRewardCsReq = 8374;
    CmdRechargeGiftType_TakeRechargeBenefitRewardScRsp = 8367;
    CmdRechargeGiftType_SyncRechargeBenefitInfoScNotify = 8371;
    CmdRechargeGiftType_GetRechargeGiftInfoScRsp = 8375;
    CmdRechargeGiftType_GetRechargeGiftInfoCsReq = 8365;
    CmdRechargeGiftType_TakeRechargeGiftRewardCsReq = 8380;
    CmdRechargeGiftType_GetRechargeBenefitInfoCsReq = 8369;
}

enum EGCFNCBLHJC {
    EGCFNCBLHJC_EDHBOMMOKGM = 0;
    EGCFNCBLHJC_ACBHGLIBJBG = 1;
    EGCFNCBLHJC_LJLKNDIACEO = 2;
}

message GetRechargeBenefitInfoCsReq {
}

message GetRechargeBenefitInfoScRsp {
    repeated BCAJNMLLIED OABBABNPPOO = 10;
    uint32 retcode = 6;
}

message GetRechargeGiftInfoCsReq {
}

message GetRechargeGiftInfoScRsp {
    repeated JBNGCJJDLHL OFIHOCCHNCN = 3;
    uint32 retcode = 5;
}

message IJHPILBBHDI {
    EGCFNCBLHJC status = 10;
    uint32 index = 2;
}

message JBNGCJJDLHL {
    int64 start_time = 7;
    uint32 gift_type = 12;
    int64 end_time = 15;
    repeated IJHPILBBHDI status_list = 8;
}

message SyncRechargeBenefitInfoScNotify {
    BCAJNMLLIED KLCGBJIEMPO = 3;
}

message TakeRechargeBenefitRewardCsReq {
    uint32 id = 5;
}

message TakeRechargeBenefitRewardScRsp {
    ItemList reward = 11;
    uint32 retcode = 7;
    BCAJNMLLIED KLCGBJIEMPO = 15;
}

message TakeRechargeGiftRewardCsReq {
