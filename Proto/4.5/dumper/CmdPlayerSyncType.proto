    repeated uint32 LEBFLAKCJCM = 7;
    repeated uint32 DEPBONHELFD = 5;
    repeated uint32 OBCBLABECEA = 1;
}

message PFNHCOJOBKH {
    repeated uint32 LKAKMGKENOI = 1;
    repeated uint32 ABMLLCOKOLN = 12;
}

message PlayerBoardModuleSync {
    HeadFrameInfo head_frame_info = 10;
    repeated uint32 GHNJNFKJEDC = 14;
    bool MFFGEMKLNBF = 11;
    string signature = 6;
