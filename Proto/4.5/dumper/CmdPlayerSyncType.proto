syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

message AvatarSync {
    repeated Avatar avatar_list = 8;
    repeated AvatarPathData avatar_path_data_info_list = 14;
}

message BasicModuleSync {
