    repeated uint32 del_relic_list = 14;
    AvatarSync avatar_sync = 5;
    MissionSync mission_sync = 8;
    repeated Quest quest_list = 1;
}

message SectionStatus {
    uint32 section_id = 2;
    MessageSectionStatus section_status = 14;
}

message SyncStatus {
    repeated GroupStatus message_group_status = 5;
    repeated uint32 BGPACBIJDCH = 15;
    repeated uint32 MDANGIEIMIF = 3;
    repeated SectionStatus section_status = 14;
}
