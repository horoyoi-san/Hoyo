syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

import "Common.proto";

enum CmdQuestType {
    CmdQuestType_NLCDGIPGFDJ = 0;
    CmdQuestType_TakeQuestOptionalRewardScRsp = 933;
    CmdQuestType_TakeQuestRewardScRsp = 958;
    CmdQuestType_IKABMLMGLHN = 940;
    CmdQuestType_GetQuestRecordScRsp = 947;
    CmdQuestType_FinishClientAchievementCsReq = 913;
    CmdQuestType_OJKCEKKDLEL = 939;
    CmdQuestType_PJEHEOLCFCF = 904;
    CmdQuestType_GetQuestRecordCsReq = 986;
    CmdQuestType_OIHECCNGJKO = 993;
    CmdQuestType_GetQuestDataCsReq = 925;
    CmdQuestType_GetQuestDataScRsp = 978;
    CmdQuestType_CFHHFHMGAGL = 971;
    CmdQuestType_QuestRecordScNotify = 926;
