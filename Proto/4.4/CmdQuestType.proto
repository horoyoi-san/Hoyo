message TakeQuestOptionalRewardScRsp {
    ItemList reward = 2;
    uint32 quest_id = 6;
    uint32 retcode = 13;
}

message TakeQuestRewardScRsp {
    repeated uint32 succ_quest_id_list = 5;
    ItemList reward = 9;
    uint32 retcode = 10;
    repeated uint32 quest_id_list = 13;
}
