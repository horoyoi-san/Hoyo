syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message GetAllServerPrefsDataScRsp {
    uint32 retcode = 13;
    repeated ServerPrefs server_prefs_list = 14;
}

message GetServerPrefsDataCsReq {
    uint32 server_prefs_id = 10;
}

message GetServerPrefsDataScRsp {
    ServerPrefs server_prefs = 13;
    uint32 retcode = 14;
}

message ServerPrefs {
    uint32 server_prefs_id = 10;
    bytes data = 14;
}

message UpdateServerPrefsCsReq {
    ServerPrefs server_prefs = 4;
}

message UpdateServerPrefsDataScRsp {
    uint32 server_prefs_id = 11;
    uint32 retcode = 15;
}
