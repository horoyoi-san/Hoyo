syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

enum CmdMusicRhythmType {
    CmdMusicRhythmType_NLCDGIPGFDJ = 0;
    CmdMusicRhythmType_MusicRhythmStartLevelScRsp = 7574;
    CmdMusicRhythmType_MusicRhythmMaxDifficultyLevelsUnlockNotify = 7590;
    CmdMusicRhythmType_MusicRhythmUnlockSongSfxScNotify = 7585;
    CmdMusicRhythmType_MusicRhythmStartLevelCsReq = 7588;
    CmdMusicRhythmType_BHGAAEBOBOO = 7582;
    CmdMusicRhythmType_MusicRhythmSaveSongConfigDataScRsp = 7591;
    CmdMusicRhythmType_MusicRhythmFinishLevelScRsp = 7592;
    CmdMusicRhythmType_IMBKCHOMGBP = 7599;
    CmdMusicRhythmType_MusicRhythmUnlockTrackScNotify = 7577;
    CmdMusicRhythmType_MusicRhythmFinishLevelCsReq = 7575;
    CmdMusicRhythmType_PGGPINKJPJA = 7579;
    CmdMusicRhythmType_MusicRhythmDataScRsp = 7595;
}

message MusicRhythmDataScRsp {
    repeated uint32 unlock_track_list = 1;
    bool show_hint = 2;
    repeated MusicRhythmLevel level_data_list = 4;
    repeated MusicRhythmGroup music_group = 5;
    uint32 cur_song_id = 7;
    repeated uint32 unlock_phase_list = 8;
    uint32 cur_level_id = 10;
    uint32 retcode = 11;
    repeated uint32 unlock_song_list = 12;
}

message MusicRhythmFinishLevelCsReq {
    bool full_combo = 4;
    uint32 role_star = 6;
    uint32 score_id = 15;
}

message MusicRhythmFinishLevelScRsp {
    uint32 retcode = 7;
    uint32 level_id = 15;
}

message MusicRhythmGroup {
    repeated uint32 BBINFDHMGII = 2;
    uint32 music_group_id = 3;
    uint32 music_group_phase = 4;
    repeated uint32 EOHMNCBOALC = 10;
}

message MusicRhythmLevel {
    uint32 unlock_level = 2;
    uint32 level_id = 9;
    bool full_combo = 12;
}

message MusicRhythmMaxDifficultyLevelsUnlockNotify {
}

message MusicRhythmSaveSongConfigDataScRsp {
    uint32 EFEGLAOAJDA = 4;
    uint32 cur_song_id = 12;
    uint32 retcode = 13;
}

message MusicRhythmStartLevelCsReq {
    uint32 level_id = 14;
}

message MusicRhythmStartLevelScRsp {
    string trans_no = 6;
    uint32 retcode = 10;
    uint32 level_id = 15;
}

message MusicRhythmUnlockSongSfxScNotify {
    repeated uint32 PHCHFKMHDMA = 10;
}

message MusicRhythmUnlockTrackScNotify {
    repeated uint32 PFHNONKNHAC = 11;
}
