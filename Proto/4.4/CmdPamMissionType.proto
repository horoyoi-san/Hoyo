syntax = "proto3";

option csharp_namespace = "March7thHoney.Proto";

message AcceptedPamMissionExpireCsReq {
    uint32 main_mission_id = 15;
}

message AcceptedPamMissionExpireScRsp {
    uint32 retcode = 4;
}

enum CmdPamMissionType {
    CmdPamMissionType_NLCDGIPGFDJ = 0;
    CmdPamMissionType_SyncAcceptedPamMissionNotify = 4093;
    CmdPamMissionType_AcceptedPamMissionExpireCsReq = 4025;
    CmdPamMissionType_AcceptedPamMissionExpireScRsp = 4078;
}

message SyncAcceptedPamMissionNotify {
    uint32 main_mission_id = 1;
    uint64 expire_time = 13;
}
