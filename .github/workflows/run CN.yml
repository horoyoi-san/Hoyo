name: Hoyo Game Monitor CN 05:00

on:
  schedule:
    - cron: "0 22 * * *" # รันทุกวันเวลา 05:00 (เวลาไทย)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests


      - name: Run all game monitors
        env:
          WEBHOOK1: ${{ secrets.WEBHOOK1 }}
          WEBHOOK2: ${{ secrets.WEBHOOK2 }}
          WEBHOOK3: ${{ secrets.WEBHOOK3 }}
          WEBHOOK4: ${{ secrets.WEBHOOK4 }}
          WEBHOOK5: ${{ secrets.WEBHOOK5 }}
        run: |
          python CN/GI.py
          python CN/HI3.py
          python CN/HSR.py
          python CN/ZZZ.py
          python CN/HNA.py
          python CN/PP.py

      - name: Commit and Push logs
        env:
          PAT: ${{ secrets.PAT }} # ใส่ Personal Access Token ของคุณใน secrets
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          mkdir -p OSHoyo/log
          mkdir -p CNHoyo/log

          git add OSHoyo/log
          git add CNHoyo/log

          if ! git diff --cached --quiet; then
            git commit -m "Update logs [skip ci]"
            git push https://x-access-token:${PAT}@github.com/${{ github.repository }} HEAD:Webhook
          else
            echo "No changes to commit"
          fi
