name: Hoyo Game Monitor 13:30

on:
  schedule:
    - cron: "30 6 * * *" # รันทุกวันเวลา 13:30 (เวลาไทย)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -U discord.py

      - name: Run all miHoYo game monitors
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN_1 }}
        run: |
          python "HoyoGame/CN/Branches/hk4e_cn.py"
          python "HoyoGame/CN/Branches/abc_cn.py"
          python "HoyoGame/CN/Branches/hkrpg_cn.py"
          python "HoyoGame/CN/Branches/bh3_cn.py"
          python "HoyoGame/CN/Branches/nap_cn.py"
          python "HoyoGame/CN/Branches/hyg_cn.py"
          python "HoyoGame/CN/Branches/kl_cn.py"

          python "HoyoGame/CN/Packages/hk4e_cn.py"
          python "HoyoGame/CN/Packages/abc_cn.py"
          python "HoyoGame/CN/Packages/hkrpg_cn.py"
          python "HoyoGame/CN/Packages/bh3_cn.py"
          python "HoyoGame/CN/Packages/nap_cn.py"
          python "HoyoGame/CN/Packages/hyg_cn.py"
          python "HoyoGame/CN/Packages/kl_cn.py"

          python "HoyoGame/OS/Branches/hk4e.py"
          python "HoyoGame/OS/Branches/abc.py"
          python "HoyoGame/OS/Branches/hkrpg.py"
          python "HoyoGame/OS/Branches/bh3.py"
          python "HoyoGame/OS/Branches/hyg.py"
          python "HoyoGame/OS/Branches/nap.py"

          python "HoyoGame/OS/Packages/hk4e.py"
          python "HoyoGame/OS/Packages/abc.py"
          python "HoyoGame/OS/Packages/hkrpg.py"
          python "HoyoGame/OS/Packages/bh3.py"
          python "HoyoGame/OS/Packages/hyg.py"
          python "HoyoGame/OS/Packages/nap.py"

      - name: Commit and Push logs
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          mkdir -p log/OSHoyo/Branches
          mkdir -p log/CNHoyo/Branches
          mkdir -p log/OSHoyo/Packages
          mkdir -p log/CNHoyo/Packages

          git add log/OSHoyo/Branches
          git add log/CNHoyo/Branches
          git add log/OSHoyo/Packages
          git add log/CNHoyo/Packages

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update logs [skip ci]"

          git push origin HEAD:Webhook
