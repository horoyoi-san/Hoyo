name: Hoyo Game Monitor

on:
  schedule:
    - cron: "*/5 * * * *"  # ทุก 1 นาที
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install requests

      - name: Run all game monitors
        env:
          WEBHOOK1: ${{ secrets.WEBHOOK1 }}
          WEBHOOK2: ${{ secrets.WEBHOOK2 }}
          WEBHOOK3: ${{ secrets.WEBHOOK3 }}
          WEBHOOK4: ${{ secrets.WEBHOOK4 }}
        run: |
          python GI.py
          python HI3.py
          python HSR.py
          python ZZZ.py
          python HNA.py

      - name: Commit & Push logs
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add Hoyo/log
          git commit -m "Update logs [skip ci]" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:${{ github.ref }}
