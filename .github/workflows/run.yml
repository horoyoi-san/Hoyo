name: Hoyo Game Monitor

on:
  schedule:
    - cron: "0 22 * * *" # รันทุกวันเวลา 05:00 (เวลาไทย)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install requests

      - name: Run all game monitors
        env:
          WEBHOOK1: ${{ secrets.WEBHOOK1 }}
          WEBHOOK2: ${{ secrets.WEBHOOK2 }}
          WEBHOOK3: ${{ secrets.WEBHOOK3 }}
          WEBHOOK4: ${{ secrets.WEBHOOK4 }}
        run: |
          python OS/GI.py
          python OS/HI3.py
          python OS/HSR.py
          python OS/ZZZ.py
          python OS/HNA.py

          python CN/GI.py
          python CN/HI3.py
          python CN/HSR.py
          python CN/ZZZ.py
          python CN/HNA.py
          
      - name: Commit and Push logs
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # สร้างโฟลเดอร์เก็บ log ทั้ง 2 ภูมิภาค
          mkdir -p OSHoyo/log
          mkdir -p CNHoyo/log

          # เพิ่มไฟล์ log ทั้งคู่เข้า staging
          git add OSHoyo/log
          git add CNHoyo/log

          # ตรวจสอบว่ามีการเปลี่ยนแปลงหรือไม่
          if ! git diff --cached --quiet; then
            git commit -m "Update logs [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
          else
            echo "No changes to commit"
          fi