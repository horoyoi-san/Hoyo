name: Build Sunbringer Launcher

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sunbringer-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Hoyo
        uses: actions/checkout@v4

      - name: Checkout launcher source
        uses: actions/checkout@v4
        with:
          repository: horoyoi-san/game-Launcher
          ref: sunbringer-launcher
          path: source
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.59
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Calculate launcher version
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:RUNNER_TEMP "sunbringer-latest.json"
          $manifestUrl = "https://github.com/horoyoi-san/Hoyo/releases/download/nap/latest.json"
          $status = & curl.exe --location --silent --show-error --output $manifestPath --write-out "%{http_code}" "$manifestUrl?cachebust=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check the current Sunbringer launcher manifest."
          }

          if ($status -eq "200") {
            $currentVersion = (Get-Content -Raw $manifestPath | ConvertFrom-Json).version
            $version = node source/scripts/launcher-release.mjs next $currentVersion
            if ($LASTEXITCODE -ne 0) {
              throw "Could not calculate the next Sunbringer launcher version."
            }
          } elseif ($status -eq "404") {
            $version = "1.0.0"
          } else {
            throw "Sunbringer launcher manifest request returned HTTP $status."
          }

          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "LAUNCHER_VERSION=$version" + [Environment]::NewLine)
          node source/scripts/launcher-release.mjs stamp-info $version source/build/windows/info.json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not stamp the Windows executable version."
          }
          Write-Host "Building Sunbringer Launcher version $version"

      - name: Build Windows executable
        working-directory: source
        run: wails3 task build BUILD_VERSION=$env:LAUNCHER_VERSION
        env:
          PRODUCTION: "true"

      - name: Prepare release assets
        shell: pwsh
        run: |
          $builtLauncher = "source/bin/sunbringer-launcher.exe"
          if (!(Test-Path $builtLauncher)) {
            throw "Expected build output $builtLauncher was not produced."
          }
          $releaseLauncher = Join-Path $env:RUNNER_TEMP "Sunbringer.exe"
          Copy-Item -LiteralPath $builtLauncher -Destination $releaseLauncher
          $manifestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          node source/scripts/launcher-release.mjs manifest $env:LAUNCHER_VERSION $releaseLauncher $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create the Sunbringer launcher update manifest."
          }

      - name: Publish to Hoyo nap release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nap
          files: |
            ${{ runner.temp }}/Sunbringer.exe
            ${{ runner.temp }}/latest.json
          overwrite_files: true
          fail_on_unmatched_files: true
