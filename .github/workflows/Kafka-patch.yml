name: Kafka patch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-Kafka-patch
  cancel-in-progress: false

jobs:
  build-patch:
    runs-on: windows-latest

    steps:
      - name: Checkout Unknown_Realm source
        uses: actions/checkout@v4
        with:
          repository: horoyoi-san/Hoyo
          ref: nap-Kafka-zig_patch
          path: source

      - name: Install Zig 0.17.0
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.17.0.zip'
          $zigRoot = Join-Path $env:RUNNER_TEMP 'zig-0.17.0'
          curl.exe --location --fail --silent --show-error 'https://ziglang.org/download/0.17.0/zig-x86_64-windows-0.17.0.zip' --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'Could not download Zig 0.17.0.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $zigRoot -Force
          $zigExe = Join-Path $zigRoot 'zig-x86_64-windows-0.17.0/zig.exe'
          if (!(Test-Path -LiteralPath $zigExe)) { throw "Zig executable not found: $zigExe" }
          $version = (& $zigExe version).Trim()
          if ($version -ne '0.17.0') { throw "Expected Zig 0.17.0, found $version" }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ZIG_EXE=$zigExe$([Environment]::NewLine)")

      - name: Build Windows patch
        working-directory: source
        shell: pwsh
        run: |
          & $env:ZIG_EXE build -Dtarget=x86_64-windows -Doptimize=ReleaseSmall
          if ($LASTEXITCODE -ne 0) { throw 'Zig patch build failed.' }
          foreach ($file in @('zig-out/bin/Kafka.exe', 'zig-out/bin/Unknown_Realm.dll')) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Expected patch output was not produced: $file" }
          }

      - name: Create patch update manifest
        working-directory: source
        shell: pwsh
        run: |
          $assets = @{}
          foreach ($name in @('Kafka.exe', 'Unknown_Realm.dll')) {
            $file = Join-Path 'zig-out/bin' $name
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $assets[$name] = @{ sha256 = $hash; size = (Get-Item -LiteralPath $file).Length }
          }
          $manifest = @{
            version = '1.0'
            assets = $assets
          }
          $manifestPath = Join-Path (Get-Location) 'patch-latest.json'
          $json = $manifest | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($manifestPath, "$json`n", [System.Text.UTF8Encoding]::new($false))
          Write-Host "Patch version: $($manifest.version)"

      - name: Publish patch assets to Hoyo nap release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nap
          files: |
            source/zig-out/bin/Kafka.exe
            source/zig-out/bin/Unknown_Realm.dll
            source/patch-latest.json
          overwrite_files: true
          fail_on_unmatched_files: true
