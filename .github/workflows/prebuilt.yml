name: Prebuilt release

on:
  push:
    branches:
      - hkrpg-PS
  workflow_dispatch:

concurrency:
  group: hkrpg-ps-server-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prebuilt:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: hkrpg-PS

      - name: Read next server version
        id: server_version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath server-version.txt -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid server version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Build release binaries
        run: cargo build --release --bin gameserver --bin sdkserver

      - name: Package prebuilt release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          Copy-Item target/release/gameserver.exe dist/
          Copy-Item target/release/sdkserver.exe dist/
          Copy-Item persistent, res.json, freesr-data.json, versions.json dist/

          @'
          @echo off
          title Hoyo Server
          echo Starting Game Server...
          start "Game Server" cmd /k gameserver.exe
          echo Starting SDK Server...
          start "SDK Server" cmd /k sdkserver.exe
          '@ | Out-File -FilePath dist/run.bat -Encoding ascii

          Compress-Archive -Path dist/* -DestinationPath prebuilt-win64.zip -Force

      - name: Generate server update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath prebuilt-win64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @{ version = "${{ steps.server_version.outputs.version }}"; build_id = "${{ github.sha }}"; sha256 = $hash } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$PWD/server-latest.json", "$manifest`n", [System.Text.UTF8Encoding]::new($false))

      - name: Upload server package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload hkrpg prebuilt-win64.zip --clobber

      - name: Publish server update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload hkrpg server-latest.json --clobber
      - name: Advance next server version
        shell: pwsh
        run: |
          $version = "${{ steps.server_version.outputs.version }}"
          $parts = $version.Split('.')
          $nextPatch = ([long]$parts[2] + 1).ToString()
          $nextVersion = "$($parts[0]).$($parts[1]).$nextPatch"

          git fetch origin hkrpg-PS
          git checkout -B hkrpg-PS origin/hkrpg-PS
          $configuredVersion = (Get-Content -LiteralPath server-version.txt -Raw).Trim()
          if ($configuredVersion -ne $version) {
            Write-Host "server-version.txt changed during this build; keeping the manual version change."
            exit 0
          }

          [System.IO.File]::WriteAllText("$PWD/server-version.txt", "$nextVersion`n", [System.Text.UTF8Encoding]::new($false))
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-version.txt
          git commit -m "chore: set next server version $nextVersion [skip ci]"
          git push origin HEAD:hkrpg-PS
