name: Prebuilt release

on:
  push:
    branches:
      - hkrpg-PS
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prebuilt:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Build release binaries
        run: cargo build --release --bin gameserver --bin sdkserver

      - name: Package prebuilt release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          Copy-Item target/release/gameserver.exe dist/
          Copy-Item target/release/sdkserver.exe dist/
          Copy-Item persistent, res.json, freesr-data.json, versions.json dist/

          @'
          @echo off
          title Hoyo Server
          echo Starting Game Server...
          start "Game Server" cmd /k gameserver.exe
          echo Starting SDK Server...
          start "SDK Server" cmd /k sdkserver.exe
          '@ | Out-File -FilePath dist/run.bat -Encoding ascii

          Compress-Archive -Path dist/* -DestinationPath prebuilt-win64.zip -Force

      - name: Upload to hkrpg release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload hkrpg prebuilt-win64.zip --clobber
