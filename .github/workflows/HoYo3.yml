name: Hoyo Game Monitor 18:00

on:
  schedule:
    - cron: "00 11 * * *" # รันทุกวันเวลา 18:00 (เวลาไทย)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -U discord.py

      - name: Run all miHoYo game monitors
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN_1 }}
        run: |
          python "HoyoGame/CN/Branches/hk4e_cn"
          python "HoyoGame/CN/Branches/abc_cn"
          python "HoyoGame/CN/Branches/hkrpg_cn"
          python "HoyoGame/CN/Branches/bh3_cn"
          python "HoyoGame/CN/Branches/nap_cn"
          python "HoyoGame/CN/Branches/hyg_cn"
          python "HoyoGame/CN/Branches/kl_cn"

          python "HoyoGame/CN/Packages/hk4e_cn"
          python "HoyoGame/CN/Packages/abc_cn"
          python "HoyoGame/CN/Packages/hkrpg_cn"
          python "HoyoGame/CN/Packages/bh3_cn"
          python "HoyoGame/CN/Packages/nap_cn"
          python "HoyoGame/CN/Packages/hyg_cn"
          python "HoyoGame/CN/Packages/kl_cn"

          python "HoyoGame/OS/Branches/hk4e"
          python "HoyoGame/OS/Branches/abc"
          python "HoyoGame/OS/Branches/hkrpg"
          python "HoyoGame/OS/Branches/bh3"
          python "HoyoGame/OS/Branches/hyp"
          python "HoyoGame/OS/Branches/nap"

          python "HoyoGame/OS/Packages/hk4e"
          python "HoyoGame/OS/Packages/abc"
          python "HoyoGame/OS/Packages/hkrpg"
          python "HoyoGame/OS/Packages/bh3"
          python "HoyoGame/OS/Packages/hyp"
          python "HoyoGame/OS/Packages/nap"

      - name: Commit and Push logs
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          mkdir -p log/OSHoyo/Branches
          mkdir -p log/CNHoyo/Branches
          mkdir -p log/OSHoyo/Packages
          mkdir -p log/CNHoyo/Packages

          git add log/OSHoyo/Branches
          git add log/CNHoyo/Branches
          git add log/OSHoyo/Packages
          git add log/CNHoyo/Packages

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update logs [skip ci]"

          git push origin HEAD:Webhook