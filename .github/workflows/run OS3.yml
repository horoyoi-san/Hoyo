name: Hoyo Game Monitor OS 18:00

on:
  schedule:
    - cron: "00 11 * * *" # รันทุกวันเวลา 18:00 (เวลาไทย)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests


      - name: Run all game monitors
        env:
          WEBHOOK1: ${{ secrets.WEBHOOK1 }}
          WEBHOOK2: ${{ secrets.WEBHOOK2 }}
          WEBHOOK3: ${{ secrets.WEBHOOK3 }}
          WEBHOOK4: ${{ secrets.WEBHOOK4 }}
          WEBHOOK5: ${{ secrets.WEBHOOK5 }}
        run: |
          python "HoyoGame/OS/Honkai Star Rail Branches.py"
          python "HoyoGame/OS/Genshin Impact Branches.py"
          python "HoyoGame/OS/Genshin Impact.py"
          python "HoyoGame/OS/Honkai Impact3.py"
          python "HoyoGame/OS/Honkai Star Rail.py"
          python "HoyoGame/OS/Zenless Zone Zero.py"
          python "HoyoGame/OS/Honkai Nexun Anima.py"
          python "HoyoGame/OS/Petit Planet.py"

      - name: Commit and Push logs
        env:
          PAT: ${{ secrets.PAT }} # ใส่ Personal Access Token ของคุณใน secrets
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          mkdir -p log/OSHoyo/log
          mkdir -p log/CNHoyo/log

          git add log/OSHoyo/log
          git add log/CNHoyo/log

          if ! git diff --cached --quiet; then
            git commit -m "Update logs [skip ci]"
            git push https://x-access-token:${PAT}@github.com/${{ github.repository }} HEAD:Webhook
          else
            echo "No changes to commit"
          fi