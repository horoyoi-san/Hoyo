[package]
name = "starrail-exe"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "StarRail"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Environment",
    "Win32_UI_WindowsAndMessaging",
] }
version = { package = "dumper", path = "../dumper" }

[build-dependencies]
winres = "0.1"
image = "0.25"
